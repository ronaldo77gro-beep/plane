<style>
/* Layout: dark felt, gold hairlines. Admin = tabs of working panels; TV = one giant clock. Single theme by choice. */

  color-scheme:dark;
  --felt:#0c2a20; --deep:#071b14; --lift:#123828; --lift2:#18463a;
  --gold:#c9a45c; --gold2:#e6cf9a; --ivory:#efe9da; --muted:#9fb0a3;

  --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--felt);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 60px}
header.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0}
.brand{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:.12em;color:var(--gold2)}
.brand i{font-style:normal;color:var(--gold);margin-right:6px}
.tname{color:var(--muted);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid rgba(201,164,92,.35);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--ok)} .pill.warn::before{background:var(--warn)} .pill.bad::before{background:var(--bad)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;border-bottom:1px solid rgba(201,164,92,.25)}
nav.tabs button{background:none;border:0;padding:9px 13px;border-radius:10px 10px 0 0;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--gold2);background:var(--lift);box-shadow:inset 0 -2px 0 var(--gold)}
.btn{background:var(--lift2);border:1px solid rgba(201,164,92,.4);border-radius:10px;padding:9px 14px;cursor:pointer;color:var(--ivory);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
.btn.bad{border-color:rgba(239,107,94,.6);color:#ffb3aa}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
input,select,textarea{background:var(--deep);border:1px solid rgba(201,164,92,.3);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--lift);border:1px solid rgba(201,164,92,.25);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-family:var(--display);font-weight:600;color:var(--gold2);font-size:26px;margin:0 0 10px}
h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
/* clock panel */
.clock{text-align:center;padding:22px 12px}
.clock .lvl{letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-size:14px}

.clock .tm.low{color:var(--warn)} .clock .tm.paused{opacity:.55}

.clock .nx{color:var(--muted);margin-top:6px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* lists */

tr.cur td{background:rgba(201,164,92,.1)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input{color:var(--ivory);font-size:16px}
/* dealer */
.clock.dl{padding:14px 10px}.clock.dl .tm{font-size:clamp(64px,20vw,120px)}
.seatbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--deep);border:1px solid rgba(201,164,92,.25);border-radius:10px;padding:12px;margin-bottom:6px;cursor:pointer;font-size:17px}
.seatbtn .sn{width:26px;color:var(--gold);font-weight:600;text-align:right}.seatbtn .nm{flex:1;overflow-wrap:anywhere}
.seatbtn.free{opacity:.4;cursor:default}
.seatbtn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.floor{width:100%;padding:16px;font-size:18px;margin-bottom:14px}
.hint.call{border-left-color:var(--bad);background:rgba(239,107,94,.12)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--lift);border:1px solid var(--gold);border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
/* login */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.center .card{width:100%;max-width:380px}
/* TV */
.tv{height:100%;display:flex;flex-direction:column;padding:2.5vh 3vw;background:radial-gradient(ellipse at 50% 40%,#14402f 0,var(--felt) 55%,var(--deep) 100%)}
.tv .top{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.tv .top .brand{font-size:clamp(22px,4vw,54px)}
.tv .top .tn{font-family:var(--display);font-size:clamp(16px,2.6vw,36px);color:var(--ivory);text-align:right}
.tv .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.tv .lvl{letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-size:clamp(14px,2.4vw,34px)}
.tv .tm{font-family:var(--display);font-weight:600;line-height:.95;color:var(--gold2);font-size:min(23vw,36vh)}
.tv .tm.low{color:var(--warn)} .tv .tm.paused{opacity:.5}
.tv .bl{font-weight:700;font-size:min(7.5vw,11vh);line-height:1.1}
.tv .an{font-size:min(3.4vw,5.5vh);color:var(--gold2)}
.tv .nx{font-size:min(2.6vw,4vh);color:var(--muted);margin-top:1vh}
.tv .bot{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5vw;border-top:1px solid rgba(201,164,92,.4);padding-top:2vh}
.tv .bot div{text-align:center}
.tv .bot b{display:block;font-size:min(4.2vw,6.5vh);color:var(--gold2);font-weight:600;white-space:nowrap}
.tv .bot span{font-size:min(1.7vw,2.6vh);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tv .corner{position:fixed;right:10px;bottom:8px;display:flex;gap:6px;opacity:.35}
.tv .corner:hover,.tv .corner:focus-within{opacity:1}
.tv .off{position:fixed;left:12px;bottom:10px;font-size:13px;color:var(--warn)}
@media (max-width:600px){.p .nm{flex-basis:55%}.p .seat{flex:1;text-align:right}.p .btn.sm{flex:1}.tv .bot{grid-template-columns:repeat(2,1fr);gap:2vh}.tv .bot b{font-size:7vw}.tv .bot span{font-size:3vw}}
</style>

<body>
<div id="app" style="height:100%"></div>
<div id="modal"></div>
<script src="js/config.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const fmtK=n=>n>=1000000?(n/1000000).toLocaleString('ru-RU',{maximumFractionDigits:2})+'M':n>=10000?(n/1000).toLocaleString('ru-RU',{maximumFractionDigits:1})+'K':fmt(n);
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(s/60);return (m<10?'0':'')+m+':'+String(s%60).padStart(2,'0')};
const hm=ms=>{const m=Math.max(0,Math.round(ms/60000));return m>=60?Math.floor(m/60)+' ч '+String(m%60).padStart(2,'0')+' мин':m+' мин'};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const LS='blaind.state.v1';

/* ================= state ================= */
function defLevels(){
  const L=[[100,200,0],[100,300,0],[200,400,0],[300,600,0],'b',[400,800,800],[500,1000,1000],[600,1200,1200],[800,1600,1600],'b',[1000,2000,2000],[1500,3000,3000],[2000,4000,4000],[3000,6000,6000],'b',[4000,8000,8000],[5000,10000,10000],[6000,12000,12000],[8000,16000,16000],[10000,20000,20000],[15000,30000,30000],[20000,40000,40000]];
  return L.map(x=>x==='b'?{brk:true,min:10}:{sb:x[0],bb:x[1],ante:x[2],min:15});
}
function defState(){
  return norm({v:1,updatedAt:0,
    t:{name:'Турнир БЛАИНД',stack:30000,rebuyStack:30000,addonStack:100000,feeBuy:500,feeRebuy:1000,feeAddon:1000,tables:4,seats:9,lateReg:4,lateTime:'22:00',
       points:'400,360,320,300,280,260,240,220,200,180,160,140,120,100,80,60,40,20',pointsRest:10},
    levels:defLevels(),clock:{i:0,running:false,endsAt:0,left:15*60000},
    seated:false,players:[],base:[],moves:[]});
}
function norm(s){
  if(!Array.isArray(s.dealers))s.dealers=['Никита','Илья','Оганес'].map((n,i)=>({id:'d'+(i+1),name:n}));
  if(!s.rot)s.rot={min:30,at:0,map:{}};if(!s.rot.map)s.rot.map={};
  if(!Array.isArray(s.doneReqs))s.doneReqs=[];if(s.t.autoDealer===undefined)s.t.autoDealer=true;
  if(!Array.isArray(s.t.bonuses)&&!s.players.length&&s.t.stack===20000){Object.assign(s.t,{stack:30000,rebuyStack:30000,addonStack:100000,feeBuy:500,feeRebuy:1000,feeAddon:1000,lateTime:'22:00'})}
  if(!Array.isArray(s.t.bonuses))s.t.bonuses=[
    {id:'early',name:'Ранняя регистрация',chips:7500,bb:0,fee:0},{id:'punct',name:'Пунктуальность',chips:15000,bb:0,fee:0},
    {id:'hk1',name:'Кальян (до конца регистрации)',chips:30000,bb:0,fee:0},{id:'hk2',name:'Кальян (после регистрации)',chips:80000,bb:0,fee:0},
    {id:'lc5',name:'Last Chance 5BB',chips:0,bb:5,fee:1000},{id:'lc10',name:'Last Chance 10BB',chips:0,bb:10,fee:2000}];
  if(s.t.lateTime===undefined)s.t.lateTime='';
  if(!Array.isArray(s.moves))s.moves=[];if(!Array.isArray(s.base))s.base=[];return s;
}
function valid(s){return s&&s.v===1&&s.t&&Array.isArray(s.levels)&&s.levels.length>0&&Array.isArray(s.players)&&s.clock}
let S=defState();
(function(){try{const s=JSON.parse(ls.get(LS)||'null');if(valid(s))S=norm(s)}catch(e){}})();

let offset=0;                       // server time minus local time
const now=()=>Date.now()+offset;
let tab='clock', addName='', filter='', tvMode=location.hash==='#tv', dealerMode=location.hash==='#dealer', dTable=+ls.get('blaind.dtable')||0, reqs=[], seenReq=new Set(), dlOk=false, dealerCode='', staffMode=location.hash==='#staff', pub=null, pTab='events', pReg=false, pErr='', PA=null;
let setupNeeded=false, srv=false, online=false, authed=false, tvOk=false, tvCode='', dirty=false, loginErr='', sound=false, lastLvl=-1, lastWarn=-1;

/* ================= clock ================= */
function resolveClock(st,t){
  const c=st.clock,n=st.levels.length;let i=Math.min(Math.max(c.i|0,0),n-1);
  if(!c.running)return{i,left:Math.max(0,c.left||0),running:false};
  let end=c.endsAt;
  while(t>=end){if(i>=n-1)return{i,left:0,running:false,ended:true};i++;end+=st.levels[i].min*60000}
  return{i,left:end-t,running:true,endsAt:end};
}
function fixClock(){const r=resolveClock(S,now());S.clock=r.running?{i:r.i,running:true,endsAt:r.endsAt,left:r.left}:{i:r.i,running:false,endsAt:0,left:r.left};return r}
const lvlMs=i=>S.levels[i].min*60000;
function clockToggle(){const r=fixClock();if(r.running)S.clock={i:r.i,running:false,endsAt:0,left:r.left};else{const left=r.left>0?r.left:lvlMs(r.i);S.clock={i:r.i,running:true,endsAt:now()+left,left}}commit()}
function clockLevel(d){const r=fixClock();const i=Math.min(Math.max(r.i+d,0),S.levels.length-1);const left=lvlMs(i);S.clock={i,running:r.running,endsAt:r.running?now()+left:0,left};commit()}
function clockAdd(ms){const r=fixClock();const left=Math.max(1000,r.left+ms);S.clock={i:r.i,running:r.running,endsAt:r.running?now()+left:0,left};commit()}
const lvlNo=i=>S.levels.slice(0,i+1).filter(l=>!l.brk).length;
function lvlText(l){return l.brk?'Перерыв':fmt(l.sb)+' / '+fmt(l.bb)}
function toBreak(r){if(S.levels[r.i].brk)return null;let ms=r.left;for(let k=r.i+1;k<S.levels.length;k++){if(S.levels[k].brk)return ms;ms+=lvlMs(k)}return null}

/* ================= players & seats ================= */
const inP=()=>S.players.filter(p=>p.st==='in');
const byId=id=>S.players.find(p=>p.id===id);
function counts(){const m=new Map();inP().forEach(p=>{if(p.tb)m.set(p.tb,(m.get(p.tb)||0)+1)});return m}
function freeSeats(tb){const u=new Set(inP().filter(p=>p.tb===tb).map(p=>p.seat));const a=[];for(let s=1;s<=S.t.seats;s++)if(!u.has(s))a.push(s);return a}
function pickTable(exclude){
  const c=counts();let best=[],min=1e9;
  c.forEach((n,tb)=>{if(tb===exclude||n>=S.t.seats)return;if(n<min){min=n;best=[tb]}else if(n===min)best.push(tb)});
  if(best.length)return best[Math.floor(Math.random()*best.length)];
  for(let tb=1;tb<=S.t.tables;tb++)if(!c.has(tb)&&tb!==exclude)return tb;
  return 0;
}
function seatPlayer(p,exclude){const tb=pickTable(exclude);if(!tb){p.tb=0;p.seat=0;return false}const f=freeSeats(tb);p.tb=tb;p.seat=f[Math.floor(Math.random()*f.length)];return true}
function logMove(p,from){S.moves.unshift({at:now(),text:p.name+': '+(from||'без места')+' → стол '+p.tb+', место '+p.seat});S.moves=S.moves.slice(0,40)}
const where=p=>p.tb?'стол '+p.tb+', место '+p.seat:'';
function drawAll(){
  const ps=shuffle(inP()),n=ps.length;if(!n)return;
  const k=Math.min(S.t.tables,Math.ceil(n/S.t.seats));
  ps.forEach(p=>{p.tb=0;p.seat=0});
  const groups=Array.from({length:k},()=>[]);
  ps.slice(0,k*S.t.seats).forEach((p,i)=>groups[i%k].push(p));
  groups.forEach((g,gi)=>{const seats=shuffle(Array.from({length:S.t.seats},(_,i)=>i+1));g.forEach((p,i)=>{p.tb=gi+1;p.seat=seats[i]})});
  S.seated=true;S.moves=[{at:now(),text:'Общая рассадка: '+n+' игроков, столов: '+k}];commit();
}
function balance(){
  let guard=200,moved=0;
  while(guard--){const c=[...counts()];if(c.length<2)break;c.sort((a,b)=>b[1]-a[1]);const big=c[0],small=c[c.length-1];if(big[1]-small[1]<2)break;
    const cand=inP().filter(p=>p.tb===big[0]);const p=cand[Math.floor(Math.random()*cand.length)];const from=where(p);const f=freeSeats(small[0]);
    p.tb=small[0];p.seat=f[Math.floor(Math.random()*f.length)];logMove(p,from);moved++}
  if(moved)commit();
}
function breakTable(tb){shuffle(inP().filter(p=>p.tb===tb)).forEach(p=>{const from=where(p);p.tb=0;p.seat=0;if(seatPlayer(p,tb))logMove(p,from)});commit()}
function finalTable(){const ps=inP();const seats=shuffle(Array.from({length:S.t.seats},(_,i)=>i+1));ps.forEach((p,i)=>{const from=where(p);p.tb=1;p.seat=seats[i];logMove(p,from)});S.moves.unshift({at:now(),text:'Финальный стол собран'});commit()}
function advice(){
  const c=counts(),u=c.size,n=inP().filter(p=>p.tb).length,a=[];
  if(!S.seated||u<2)return a;
  if(n<=S.t.seats)a.push({text:'Осталось '+n+' — можно собирать финальный стол.',act:'final',label:'Собрать финальный стол'});
  else if(n<=(u-1)*S.t.seats){let tb=0,min=1e9;c.forEach((k,t)=>{if(k<min||(k===min&&t>tb)){min=k;tb=t}});a.push({text:'Игроки помещаются за '+(u-1)+' стол(а). Можно расформировать стол '+tb+'.',act:'break',id:tb,label:'Расформировать стол '+tb})}
  else{const v=[...c.values()];if(Math.max(...v)-Math.min(...v)>=2)a.push({text:'Столы неровные (разница 2 и больше).',act:'balance',label:'Выровнять столы'})}
  return a;
}
function addPlayer(name){
  name=name.trim().replace(/\s+/g,' ');if(!name)return;
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('Такой игрок уже записан');return}
  const p={id:uid(),name,st:'in',tb:0,seat:0,rb:0,ad:0,outAt:0};S.players.push(p);
  if(!S.base.some(b=>b.toLowerCase()===name.toLowerCase())){S.base.push(name);S.base.sort((a,b)=>a.localeCompare(b,'ru'))}
  if(S.seated){if(seatPlayer(p))logMove(p,'новый игрок');else toast('Свободных мест нет — игрок без места')}
  addName='';commit();
}
function bust(p){p.st='out';p.outAt=Math.max(now(),...S.players.map(x=>x.outAt||0))+1;p.tb=0;p.seat=0;commit()}
function revive(p,rebuy){p.st='in';p.outAt=0;p.ko=null;if(rebuy)p.rb++;if(S.seated){if(seatPlayer(p))logMove(p,rebuy?'повторный вход':'возврат');else toast('Свободных мест нет — игрок без места')}commit()}
function places(){const out=S.players.filter(p=>p.st==='out').sort((a,b)=>b.outAt-a.outAt);const ins=inP(),m=new Map();out.forEach((p,k)=>m.set(p.id,ins.length+1+k));if(ins.length===1&&S.players.length>1)m.set(ins[0].id,1);return m}
function coef(n){const T=[[30,2],[26,1.7],[23,1.5],[20,1.3],[18,1.2],[15,1],[12,.8],[10,.7]];for(const[k,v]of T)if(n>=k)return v;return .5}
function basePts(pl){const a=String(S.t.points||'').split(/[,;\s]+/).map(Number).filter(x=>!isNaN(x));return pl<=a.length?a[pl-1]:(+S.t.pointsRest||0)}
function totals(){const P=S.players,rb=P.reduce((s,p)=>s+p.rb,0),ad=P.reduce((s,p)=>s+p.ad,0);const ex=P.reduce((s,p)=>s+exSum(p),0),exf=P.reduce((s,p)=>s+(p.ex||[]).reduce((a,x)=>a+(x.f||0),0),0);const chips=P.length*S.t.stack+rb*S.t.rebuyStack+ad*S.t.addonStack+ex;const left=inP().length;
  return{entries:P.length,left,rb,ad,chips,avg:left?chips/left:0,fees:P.length*S.t.feeBuy+rb*S.t.feeRebuy+ad*S.t.feeAddon+exf}}
const exSum=p=>(p.ex||[]).reduce((a,x)=>a+(x.c||0),0);
function curBB(){const r=resolveClock(S,now());for(let i=r.i;i>=0;i--)if(!S.levels[i].brk)return S.levels[i].bb;const f=S.levels.find(l=>!l.brk);return f?f.bb:0}
const bonusChips=b=>b.bb>0?b.bb*curBB():(+b.chips||0);
function regOpen(){const lt=/^(\d{1,2}):(\d{2})$/.exec(S.t.lateTime||'');if(lt){const d=new Date(now()+7*3600000),m=d.getUTCHours()*60+d.getUTCMinutes();return m>=6*60&&m<(+lt[1])*60+(+lt[2])}return lvlNo(resolveClock(S,now()).i)<=S.t.lateReg}

/* ================= dealers: rotation and table requests ================= */
const activeTables=()=>{const u=[...counts().keys()].sort((a,b)=>a-b);return u.length?u:Array.from({length:S.t.tables},(_,i)=>i+1)};
const dName=id=>{const d=S.dealers.find(x=>x.id===id);return d?d.name:''};
const rotLeft=()=>S.rot.at?S.rot.at+S.rot.min*60000-now():null;
function rotPreview(){const tb=activeTables(),on=tb.map(t=>dName(S.rot.map[t])?S.rot.map[t]:''),used=new Set(on.filter(Boolean)),rest=S.dealers.map(d=>d.id).filter(id=>!used.has(id));
  const ring=on.concat(rest);if(!ring.some(Boolean))return null;ring.unshift(ring.pop());const m={};tb.forEach((t,i)=>{if(ring[i])m[t]=ring[i]});return m}
function nextOf(did){const m=rotPreview();if(!m)return '';const t=Object.keys(m).find(k=>m[k]===did);return t?'стол '+t:'резерв'}
const REQT={bust:'вылет',rb:'ребай',ad:'аддон',floor:'вызов флора',chips:'фишки'};
const reqText=r=>r.type==='chips'?String(r.label||'фишки')+' '+(r.chips>0?'+':'')+fmt(r.chips|0):REQT[r.type];
function applyReq(r){
  if(r.id){if(S.doneReqs.includes(r.id))return;S.doneReqs.push(r.id);S.doneReqs=S.doneReqs.slice(-200)}
  const p=byId(r.pid);
  if(p){if(r.type==='bust'){if(p.st==='in'){p.ko={by:r.by||'',dice:Math.min(99,Math.max(0,r.dice|0))};bust(p);return}}
    else if(r.type==='rb')p.rb++;else if(r.type==='ad')p.ad++;
    else if(r.type==='chips'&&(r.chips|0)){(p.ex=p.ex||[]).push({n:String(r.label||'Вручную').slice(0,40),c:r.chips|0,f:Math.max(0,r.fee|0),at:now()})}}
  commit();
}
function doneReq(id,ok){reqs=reqs.filter(x=>x.id!==id);api('api/req/done',{method:'POST',body:{id,ok:!!ok}}).catch(()=>{});render()}
function processReqs(){
  if(srv&&!authed)return;
  reqs.slice().forEach(r=>{if(r.done)return;
    if(!seenReq.has(r.id)){seenReq.add(r.id);if(r.type==='floor'){beep(2);toast('Стол '+r.tb+' зовёт флора')}}
    if(r.type==='floor')return;
    if(S.doneReqs.includes(r.id))doneReq(r.id,true);
    else if(S.t.autoDealer){applyReq(r);doneReq(r.id,true)}});
}
function setReqs(list){reqs=Array.isArray(list)?list:[];processReqs();render()}
async function sendReq(r){
  if((!srv||authed)&&r.type!=='floor'){applyReq(r);toast('Отмечено: '+reqText(r));return}
  if(!srv){toast('В локальном режиме флор — это вы');return}

}
function reqBanner(){

    if(r.type==='floor')return '<div class="hint call"><span><b>Стол '+(+r.tb)+'</b> зовёт флора'+who+'</span><button class="btn sm" data-a="reqok" data-id="'+esc(r.id)+'">Принял</button></div>';

function pullLocal(){try{const s=JSON.parse(ls.get(LS)||'null');if(valid(s)&&s.updatedAt>S.updatedAt){S=norm(s);render()}}catch(e){}}
function commit(){S.updatedAt=Math.max(now(),(S.updatedAt||0)+1);ls.set(LS,JSON.stringify(S));try{bc&&bc.postMessage(1)}catch(e){}render();if(srv){dirty=true;push()}}
function adopt(remote,t){if(typeof t==='number')offset=t-Date.now();if(valid(remote)&&remote.updatedAt>S.updatedAt){S=norm(remote);ls.set(LS,JSON.stringify(S));render();return true}return false}
/* Связь с базой: все маршруты прежнего server.js обслуживает функция bl_api в Supabase.
   Токены сессий: sid — администратор, tv — экран, dl — крупье, pu — игрок. */
const CFG=window.BLIND_CONFIG||{};
const HAS_DB=!!(CFG.SUPABASE_URL&&/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(CFG.SUPABASE_URL+'/')&&CFG.SUPABASE_ANON_KEY);
const TOK={get(k){return ls.get('blaind.tok.'+k)},set(k,v){if(v)ls.set('blaind.tok.'+k,v);else ls.del('blaind.tok.'+k)}};
async function api(path,opt){opt=opt||{};if(!HAS_DB)throw new Error('no db');const c=new AbortController();const to=setTimeout(()=>c.abort(),8000);
  try{
    const r=await fetch(CFG.SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/rpc/bl_api',{method:'POST',cache:'no-store',signal:c.signal,
      headers:{'Content-Type':'application/json','apikey':CFG.SUPABASE_ANON_KEY},
      body:JSON.stringify({p_method:opt.method||'GET',p_path:path,p_body:opt.body||{},p_tokens:{sid:TOK.get('sid'),tv:TOK.get('tv'),dl:TOK.get('dl'),pu:TOK.get('pu')}})});
    if(!r.ok)throw new Error('db '+r.status);
    const j=await r.json(),body=(j&&j.body)||{},status=(j&&j.status)||500;
    return{ok:status>=200&&status<300,status,body,json:async()=>body};
  }finally{clearTimeout(to)}}
let pushing=false,pushT=null;
function push(){clearTimeout(pushT);pushT=setTimeout(doPush,150)}
async function doPush(){
  if(!srv||!authed||pushing||!dirty)return;pushing=true;const sent=S.updatedAt;
  try{const r=await api('api/state',{method:'POST',body:{state:S}});
    if(r.status===401){authed=false;ls.del('blaind.admin');TOK.set('sid',null);render()}
    else if(r.ok){if(S.updatedAt===sent)dirty=false;setOnline(true)}
    else if(r.status===409){const j=await r.json();dirty=false;adopt(j.state,j.now)}
    else throw 0;
  }catch(e){setOnline(false)}
  pushing=false;refreshPill();if(dirty&&online)push();
}
function setOnline(v){if(online!==v){online=v;render()}}
function refreshPill(){const el=document.getElementById('pill');if(el)el.outerHTML=statusPill()}
/* Живые обновления: короткий опрос раз в 2 секунды вместо постоянного соединения.
   Соединение не висит открытым, поэтому рвать нечему; база отдаёт турнир, только если он изменился. */
let es=null,lastBeat=0,polling=false,reqsSig='';
function closeES(){if(es){clearInterval(es);es=null}}
function openES(){closeES();lastBeat=Date.now();es=setInterval(poll,2000)}
async function poll(){
  if(polling)return;polling=true;
  try{const r=await api('api/poll',{body:{since:S.updatedAt||0}});
    if(r.status===401){closeES();if(authed){authed=false;ls.del('blaind.admin');TOK.set('sid',null)}tvOk=false;dlOk=false;render()}
    else if(r.ok){const j=r.body;lastBeat=Date.now();if(typeof j.now==='number')offset=j.now-Date.now();if(j.state)adopt(j.state,j.now);
      if(Array.isArray(j.reqs)){const sig=JSON.stringify(j.reqs);if(sig!==reqsSig){reqsSig=sig;setReqs(j.reqs)}}setOnline(true);if(dirty)push()}
    else throw 0;
  }catch(e){setOnline(false)}
  polling=false;
}
async function connect(){
  if(!HAS_DB)return;
  try{
    const r=await api('api/me');const j=await r.json();if(j.app!=='blaind')throw 0;
    srv=true;ls.set('blaind.srv','1');offset=j.now-Date.now();authed=!!j.auth;tvOk=!!j.tv;tvCode=j.tvCode||'';dlOk=!!j.dealer;dealerCode=j.dealerCode||'';setupNeeded=!!j.setup;
    if(authed)ls.set('blaind.admin','1');else{ls.del('blaind.admin');TOK.set('sid',null)}
    if(!tvOk)TOK.set('tv',null);if(!dlOk)TOK.set('dl',null);
    if(authed||tvOk||dlOk){
      const s=await api('api/state');
      if(s.ok){const q=await s.json();reqs=Array.isArray(q.reqs)?q.reqs:[];reqsSig=JSON.stringify(reqs);const took=adopt(q.state,q.now);if(!took&&authed&&S.updatedAt>((q.state&&q.state.updatedAt)||0)){dirty=true;push()}}
      openES();online=true;processReqs();
    }else{online=true;if(!tvMode&&!dealerMode)loadPub()}
    if(authed&&tab==='club')loadPA();
    render();
  }catch(e){
    if(!srv&&ls.get('blaind.srv')==='1'&&location.hostname){srv=true;authed=ls.get('blaind.admin')==='1'}
    setOnline(false);render();
  }
}
setInterval(()=>{if(!HAS_DB)return;if(!online||!es&&(authed||tvOk||dlOk))connect();else if(es&&Date.now()-lastBeat>20000){setOnline(false);connect()}},5000);
setInterval(()=>{if(srv&&online&&!authed&&!tvMode&&!dealerMode&&!staffMode&&!document.hidden)loadPub()},20000);
window.addEventListener('online',()=>connect());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&srv&&!online)connect()});

let actx=null;
function beep(n){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let k=0;k<n;k++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=k===n-1?880:660;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+k*.35;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.32)}}catch(e){}}

  }
  app.innerHTML=h;
  drafts.forEach(d=>{const el=document.getElementById(d[0]);if(el){if(d[2])el.checked=d[1];else if(d[1])el.value=d[1]}});
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}

function tick(){
  const r=resolveClock(S,now());
  if(lastLvl!==-1&&r.i!==lastLvl)beep(3);
  if(r.running&&r.left<=60000&&r.left>58000&&lastWarn!==r.i){lastWarn=r.i;beep(1)}
  const changed=r.i!==lastLvl||(!!r.ended&&S.clock.running);lastLvl=r.i;
  if(changed){if((!srv||authed)&&(r.i!==S.clock.i||r.ended)){fixClock();commit()}else render();return}
  const ptm=$('#ptm');if(ptm&&pub&&pub.live){const q=resolveClock({levels:pub.live.levels,clock:pub.live.clock},now());ptm.textContent=mmss(q.left)}
  const tm=$('#tm');if(tm){tm.textContent=mmss(r.left);tm.classList.toggle('low',r.running&&r.left<=60000)}
  const rl=rotLeft(),r1=$('#rotl'),r2=$('#rotl2');if(rl!=null){if(r1)r1.textContent=rl>0?'до смены '+hm(rl):'пора меняться';if(r2)r2.textContent=rl>0?' · смена через '+hm(rl):' · пора меняться'}
  const tb=$('#tbrk'),ms=toBreak(r);if(tb&&ms!=null)tb.textContent=hm(ms);
}

  newt(){ask('Начать новый турнир? Игроки, рассадка и часы будут очищены.','Начать новый',()=>{S.players=[];S.moves=[];S.seated=false;S.archivedAt=0;S.clock={i:0,running:false,endsAt:0,left:lvlMs(0)};tab='players';commit()})},
  exp(){const el=$('#dump');el.value=JSON.stringify(S);el.select();try{navigator.clipboard.writeText(el.value).then(()=>toast('Скопировано'),()=>toast('Выделено — скопируйте вручную'))}catch(e){toast('Выделено — скопируйте вручную')}},
  imp(){try{const s=JSON.parse($('#dump').value);if(!valid(s))throw 0;ask('Заменить текущие данные загруженными?','Заменить',()=>{S=norm(s);commit()})}catch(e){toast('Это не похоже на копию данных')}},
  copyres(){const txt=S.t.name+'\n'+resultRows().map(r=>r.place+'. '+r.name+' — '+r.pts).join('\n');try{navigator.clipboard.writeText(txt).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'))}catch(e){toast('Не удалось скопировать')}},
  sound(){sound=true;beep(1);render()},
  full(){try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}catch(e){}},
  async logout(){try{await api('api/logout',{method:'POST',body:{}})}catch(e){}authed=false;ls.del('blaind.admin');TOK.set('sid',null);closeES();render();loadPub()},
  codes(){ask('Выдать новые коды? Телевизорам и крупье придётся войти заново.','Выдать',async()=>{if(await pPost('api/admin/codes',{},'Новые коды выданы'))connect()})},
  rotate(){const m=rotPreview();if(!m){toast('Сначала назначьте крупье на столы');return}S.rot.map=m;S.rot.at=now();commit();toast('Крупье сменились')},
  ddel(id){S.dealers=S.dealers.filter(d=>d.id!==id);Object.keys(S.rot.map).forEach(t=>{if(S.rot.map[t]===id)delete S.rot.map[t]});commit()},
  dtable(id){dTable=+id;ls.set('blaind.dtable',String(dTable));render()},
  dseat(id){const p=byId(id);if(!p)return;const others=inP().filter(x=>x.tb===p.tb&&x.id!==id).sort((a,b)=>a.seat-b.seat);
    modal('<h2>'+esc(p.name)+'</h2><p class="muted" style="margin-top:0">Стол '+p.tb+' · место '+p.seat+'</p>'+optsHTML(p)+
      '<h3 style="margin-top:18px">Вылет</h3><div class="grid2"><label class="f">Кто выбил<select id="koBy"><option value="">не указывать</option>'+others.map(o=>'<option value="'+o.id+'">'+o.seat+'. '+esc(o.name)+'</option>').join('')+'</select></label><label class="f">Кубики (баунти)<input id="koDice" class="num" inputmode="numeric" placeholder="необязательно"></label></div>'+
      '<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn" data-a="mclose">Закрыть</button><button class="btn bad" data-a="dreq" data-id="bust|'+p.id+'">Отметить вылет</button></div>')},
  dreq(id){const k=id.split('|'),by=$('#koBy'),dc=$('#koDice');const r={type:k[0],pid:k[1],tb:dTable||((byId(k[1])||{}).tb|0),by:by?by.value:'',dice:dc?(+dc.value|0):0,dealer:dName(S.rot.map[dTable])};closeModal();sendReq(r)},
  dgive(id){const k=id.split('|'),p=byId(k[0]),b=S.t.bonuses.find(x=>x.id===k[1]);if(!p||!b)return;const c=bonusChips(b);if(!c){toast('Не удалось посчитать размер: проверьте блайнды');return}closeModal();sendReq({type:'chips',pid:p.id,tb:p.tb|0,label:b.name,chips:c,fee:b.fee|0,dealer:dName(S.rot.map[dTable])})},
  dman(id){const p=byId(id),c=Math.round(+String($('#mc').value).replace(/\s/g,'')||0);if(!p)return;if(!c||Math.abs(c)>50000000){toast('Укажите, сколько фишек выдать');return}const label=$('#mr').value.trim()||'Вручную';closeModal();sendReq({type:'chips',pid:p.id,tb:p.tb|0,label,chips:c,fee:0,dealer:dName(S.rot.map[dTable])})},
  exdel(id){const k=id.split('|'),p=byId(k[0]);if(p&&p.ex){p.ex.splice(+k[1],1);closeModal();commit()}},
  badd(){S.t.bonuses.push({id:'b'+uid(),name:'Новый бонус',chips:10000,bb:0,fee:0});commit()},
  bdel(id){S.t.bonuses=S.t.bonuses.filter(b=>b.id!==id);commit()},
  adjdel(id){ask('Убрать эту ручную правку очков?','Убрать',async()=>{if(await pPost('api/admin/adjust/del',{id}))loadPA()})},
  dfloor(){sendReq({type:'floor',tb:dTable,dealer:dName(S.rot.map[dTable])})},
  reqok(id){doneReq(id,true)}, reqno(id){doneReq(id,false)},
  reqapply(id){const r=reqs.find(x=>x.id===id);if(r){applyReq(r);doneReq(id,true)}},
  ptab(id){pTab=id;pErr='';render()},
  ptoggle(){pReg=!pReg;pErr='';render()},
  async psign(id){if(await pPost('api/p/signup',{event:id,on:true},'Вы записаны'))loadPub()},
  async punsign(id){if(await pPost('api/p/signup',{event:id,on:false},'Запись отменена'))loadPub()},
  async plogout(){await pPost('api/p/logout');TOK.set('pu',null);pTab='events';loadPub()},
  pdel(){ask('Удалить аккаунт? Записи на турниры отменятся, ник в результатах турниров заменится на «Игрок удалён». Это отзыв согласия на обработку данных.','Удалить',async()=>{if(await pPost('api/p/delete',{},'Аккаунт удалён')){TOK.set('pu',null);pTab='events';loadPub()}})},
  async evload(id){const e=PA&&PA.events.find(x=>x.id===id);if(!e)return;if(!e.names.length){toast('На этот турнир никто не записан');return}
    const have=new Set(S.players.map(p=>p.name.toLowerCase()));let n=0;e.names.forEach(nm=>{if(!have.has(nm.toLowerCase())){const p={id:uid(),name:nm,st:'in',tb:0,seat:0,rb:0,ad:0,outAt:0};S.players.push(p);if(S.seated)seatPlayer(p);n++}});
    if(!S.players.some(p=>p.st==='out')&&S.t.name==='Турнир БЛАИНД')S.t.name=e.title;commit();toast('Добавлено игроков: '+n)},
  evdel(id){ask('Удалить турнир из расписания вместе с записью?','Удалить',async()=>{if(await pPost('api/admin/event/del',{id}))loadPA()})},
  ardel(id){ask('Убрать этот турнир из рейтинга сезона?','Убрать',async()=>{if(await pPost('api/admin/archive/del',{id}))loadPA()})},
  season(){ask('Начать новый сезон? Рейтинг обнулится, старый сезон сохранится в архиве в базе.','Начать новый сезон',async()=>{if(await pPost('api/admin/season',{},'Новый сезон начат'))loadPA()})},
  async ureset(id){const j=await pPost('api/admin/user/reset',{id});if(j)modal('<h2>Новый пароль</h2><p>Передайте игроку: <b class="num" style="font-size:22px">'+esc(j.password)+'</b></p><p class="muted small">Пароль показан один раз.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="mclose">Закрыть</button></div>')},
  udel(id){ask('Удалить аккаунт игрока?','Удалить',async()=>{if(await pPost('api/admin/user/del',{id}))loadPA()})},
  async archive(){if(S.archivedAt){toast('Этот турнир уже записан в рейтинг');return}if(inP().length!==1||S.players.length<2){toast('Сначала доиграйте турнир до победителя');return}
    const j=await pPost('api/admin/archive',{name:S.t.name,rows:resultRows()},'Турнир записан в рейтинг сезона');if(j){S.archivedAt=now();commit()}},
  mclose(){closeModal()}, myes(){const f=modalYes;closeModal();f&&f()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){const f=A[b.dataset.a];if(f){e.preventDefault();f(b.dataset.id)}}else if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='addName')addName=e.target.value;if(e.target.id==='filter'){filter=e.target.value;render()}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f){const k=el.dataset.f;if(k==='lateTime'){const v=el.value.trim();if(v===''||/^([01]?\d|2[0-3]):[0-5]\d$/.test(v))S.t.lateTime=v;else toast('Время в формате 22:00')}else if(k==='name'||k==='points')S.t[k]=el.value.trim()||S.t[k];else{let v=Math.max(0,Math.floor(+String(el.value).replace(/\s/g,'')||0));if(k==='tables')v=Math.min(Math.max(v,1),50);if(k==='seats')v=Math.min(Math.max(v,2),10);S.t[k]=v}setTimeout(commit,0)}
  else if(el.dataset.b){const b=S.t.bonuses[+el.dataset.b],k=el.dataset.k;if(b){if(k==='name')b.name=el.value.trim().slice(0,40)||b.name;else b[k]=Math.max(0,Math.floor(+String(el.value).replace(/\s/g,'')||0));setTimeout(commit,0)}}
  else if(el.dataset.rt){const t=el.dataset.rt,v=el.value;Object.keys(S.rot.map).forEach(k=>{if(S.rot.map[k]===v)delete S.rot.map[k]});if(v)S.rot.map[t]=v;else delete S.rot.map[t];if(!S.rot.at)S.rot.at=now();setTimeout(commit,0)}
  else if(el.dataset.rot){S.rot.min=Math.min(Math.max(Math.floor(+el.value||30),5),240);setTimeout(commit,0)}
  else if(el.dataset.chk){S.t[el.dataset.chk]=el.checked;setTimeout(()=>{commit();processReqs()},0)}
  else if(el.dataset.l){const i=+el.dataset.l,k=el.dataset.k;let v=Math.max(0,Math.floor(+String(el.value).replace(/\s/g,'')||0));if(k==='min')v=Math.min(Math.max(v,1),180);S.levels[i][k]=v;setTimeout(commit,0)}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const k=e.target.dataset.form;
  if(k==='add'){addPlayer($('#addName').value);const el=$('#addName');el&&el.focus()}
  if(k==='setup'){loginErr='';const pw=$('#spw').value;if(pw.length<10){loginErr='Пароль: от 10 знаков.';render();return}if(pw!==$('#spw2').value){loginErr='Пароли не совпадают.';render();return}
    try{const r=await api('api/setup',{method:'POST',body:{code:$('#scode').value.trim().toUpperCase(),password:pw}});if(r.ok){TOK.set('sid',r.body.token);setupNeeded=false;toast('Пароль администратора сохранён');await connect()}else{loginErr=r.body.msg||'Не получилось';render()}}catch(x){loginErr='Нет связи с базой';render()}}
  if(k==='login'){loginErr='';try{const r=await api('api/login',{method:'POST',body:{password:$('#pw').value}});if(r.ok){TOK.set('sid',r.body.token);await connect()}else{loginErr=r.status===429?'Слишком много попыток. Подождите 10 минут.':'Неверный пароль';render()}}catch(x){loginErr='Нет связи с базой';render()}}
  if(k==='tv'){loginErr='';const code=$('#code').value.trim();try{const r=await api('api/tv',{method:'POST',body:{code}});if(r.ok){TOK.set('tv',r.body.token);await connect()}else{loginErr=r.status===429?'Слишком много попыток. Подождите 10 минут.':'Неверный код';render()}}catch(x){loginErr='Нет связи с базой';render()}}
  if(k==='adddealer'){const n=$('#dname').value.trim();if(n){S.dealers.push({id:'d'+uid(),name:n});$('#dname').value='';commit()}}
  if(k==='dealer'){loginErr='';try{const r=await api('api/dealer',{method:'POST',body:{code:$('#dcode').value.trim()}});if(r.ok){TOK.set('dl',r.body.token);await connect()}else{loginErr=r.status===429?'Слишком много попыток. Подождите 10 минут.':'Неверный код';render()}}catch(x){loginErr='Нет связи с базой';render()}}
  if(k==='plogin'||k==='preg'){pErr='';const body={nick:$('#pnick').value,password:$('#ppass').value,adult:!!($('#padult')&&$('#padult').checked),consent:!!($('#pconsent')&&$('#pconsent').checked&&$('#pdist')&&$('#pdist').checked)};
    if(k==='preg'&&!body.consent){pErr='Для регистрации нужны оба согласия: на обработку и на публикацию ника в рейтинге.';render();return}
    try{const r=await api(k==='preg'?'api/p/register':'api/p/login',{method:'POST',body});const j=await r.json().catch(()=>({}));if(r.ok){TOK.set('pu',j.token);$('#pnick').value='';$('#ppass').value='';pTab='events';await loadPub();toast(k==='preg'?'Аккаунт создан':'Вы вошли')}else{pErr=j.msg||'Не получилось';render()}}catch(x){pErr='Нет связи с базой';render()}}
  if(k==='evadd'){const j=await pPost('api/admin/event',{title:$('#evt').value.trim(),at:$('#eva').value,cap:+$('#evc').value|0},'Турнир добавлен в расписание');if(j){['#evt','#eva','#evc'].forEach(q=>{$(q).value=''});loadPA()}}
  if(k==='anon'){const name=$('#anonn').value.trim();if(!name){toast('Укажите ник');return}ask('Убрать «'+name+'» из всех результатов? Отменить нельзя.','Убрать',async()=>{const j=await pPost('api/admin/anonymize',{name});if(j){toast(j.count?'Готово: турниров изменено — '+j.count:'Ник в результатах не найден, ручные очки убраны');$('#anonn').value='';loadPA()}})}
  if(k==='adj'){const pts=Math.round(+String($('#adjp').value).replace(/\s/g,'').replace('−','-')||0);const j=await pPost('api/admin/adjust',{name:$('#adjn').value.trim(),pts,note:$('#adjc').value.trim()},'Очки начислены');if(j){['#adjn','#adjp','#adjc'].forEach(q=>{$(q).value=''});loadPA()}}
  if(k==='pass'){const n=$('#newp').value;if(n.length<10){toast('Пароль от 10 знаков');return}try{const r=await api('api/password',{method:'POST',body:{old:$('#oldp').value,password:n}});toast(r.ok?'Пароль изменён':r.status===429?'Слишком много попыток. Подождите 10 минут.':'Текущий пароль неверный');if(r.ok){TOK.set('sid',r.body.token);$('#oldp').value='';$('#newp').value='';connect()}}catch(x){toast('Нет связи с базой')}}
});
window.addEventListener('hashchange',()=>{tvMode=location.hash==='#tv';dealerMode=location.hash==='#dealer';staffMode=location.hash==='#staff';loginErr='';closeModal();render();if(srv&&online&&!authed&&!tvMode&&!dealerMode&&!staffMode)loadPub();if(srv&&online&&tvMode&&!authed&&!tvOk)connect()});

/* ================= start ================= */
render();setInterval(tick,250);connect();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
